name: Explorer release gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify generated API catalogs against pinned OpenAPI
        run: python3 scripts/generate_api_client.py --check
      - name: Generator and language-policy tests
        working-directory: scripts
        run: python3 -m unittest test_api_generation test_language_policy
      - name: Check labels, identifiers, instrument, privacy and research gates
        run: python3 scripts/check_explorer_contracts.py

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install checksum-pinned Gitleaks
        run: echo "GITLEAKS=$(scripts/install_gitleaks.sh "$RUNNER_TEMP/gitleaks")" >> "$GITHUB_ENV"
      - name: Secret-scan regression tests (keychain identifiers pass, synthetic credential detected)
        run: python3 scripts/test_secret_scan.py
      - name: Scan working tree (findings are redacted)
        run: python3 scripts/run_secret_scan.py --gitleaks "$GITLEAKS"

  portable-swift:
    name: portable-swift
    runs-on: ubuntu-latest
    # The hosted runner image no longer ships libxml2.so.2, which the standalone Swift toolchain
    # links against (run 40983365444). The official Swift image bundles a matching userland.
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Portable transport, hashing, outbox, scorer and credential tests
        run: swift test
      - name: Build with MainActor default isolation (as the app target does)
        run: swift build -Xswiftc -default-isolation -Xswiftc MainActor

  build-and-test:
    name: build-and-test
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build signed sandbox configuration
        run: >-
          xcodebuild build -project APGI-Explorer.xcodeproj -scheme APGI-Explorer
          -destination 'platform=macOS' -configuration Debug -derivedDataPath SignedDerivedData
          CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=
      - name: Verify effective app entitlements
        run: python3 scripts/verify_app_entitlements.py SignedDerivedData/Build/Products/Debug/APGI-Explorer.app
      - name: Run macOS unit and contract tests (includes native Core Data and Keychain tests)
        run: >-
          xcodebuild test -project APGI-Explorer.xcodeproj -scheme APGI-Explorer
          -destination 'platform=macOS' -configuration Debug
          -derivedDataPath DerivedData -parallel-testing-enabled NO
          -enableCodeCoverage YES
          -test-timeouts-enabled YES -default-test-execution-time-allowance 30
          -maximum-test-execution-time-allowance 60
          -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Coverage report from this run's result bundle
        if: always()
        run: xcrun xccov view --report --json TestResults.xcresult > coverage.json
      - uses: codecov/codecov-action@v5
        if: always() && github.event.pull_request.head.repo.fork != true
        with:
          files: ./coverage.json
          use_oidc: true
          fail_ci_if_error: false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: explorer-test-results
          path: TestResults.xcresult
