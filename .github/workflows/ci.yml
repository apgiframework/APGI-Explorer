name: Xcode CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.0'
    
    - name: Show Xcode Version
      run: xcodebuild -version
      
    - name: Show Swift Version
      run: swift --version
      
    - name: List Available Simulators
      run: xcrun simctl list devices
      
    - name: Build Project
      run: xcodebuild -project APGI-Explorer.xcodeproj -scheme APGI-Explorer -destination 'platform=macOS' -configuration Debug -quiet
      
    - name: Run Tests
      run: xcodebuild test -project APGI-Explorer.xcodeproj -scheme APGI-Explorer -destination 'platform=macOS' -configuration Debug -quiet
