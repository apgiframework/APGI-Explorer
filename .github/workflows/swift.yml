name: Swift release build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build native Xcode target
        run: >-
          xcodebuild build -project APGI-Explorer.xcodeproj -scheme APGI-Explorer
          -destination 'platform=macOS' -configuration Release
          -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO
