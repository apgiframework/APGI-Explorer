name: Nightly Build

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run tests
        run: >-
          xcodebuild test -project APGI-Explorer.xcodeproj -scheme APGI-Explorer
          -destination 'platform=macOS' -configuration Debug
          -derivedDataPath DerivedData -parallel-testing-enabled NO
          -enableCodeCoverage YES -test-timeouts-enabled YES
          -default-test-execution-time-allowance 30 -maximum-test-execution-time-allowance 60
          -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO

      - name: Generate test coverage report
        run: |
          xcrun xccov view --report --json TestResults.xcresult > coverage.json

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.json
          use_oidc: true
          fail_ci_if_error: false

  notify:
    needs: test
    runs-on: macos-latest
    if: failure()
    steps:
      - name: Notify failure
        run: |
          echo "❌ Nightly build failed!"
          echo "Check the logs for details."
