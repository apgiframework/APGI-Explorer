name: Release Build and Distribution

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        required: true
        default: '1.0.0'
      release_type:
        description: 'Release type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - beta
          - alpha

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            .build
          key: ${{ runner.os }}-xcode-${{ hashFiles('**/*.xcodeproj/**') }}

      - name: Run tests
        run: |
          xcodebuild test \
            -project APGI-Explorer.xcodeproj \
            -scheme APGI-Explorer \
            -destination 'platform=macOS' \
            -enableCodeCoverage YES \
            -derivedDataPath DerivedData

      - name: Generate test coverage report
        run: |
          xcrun xccov view --report --json DerivedData/Logs/Test/*.xcresult > coverage.json

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.json
          fail_ci_if_error: false

  security-scan:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run security scan
        run: |
          # Check for hardcoded secrets
          if grep -r -i "password\|secret\|key\|token" --include="*.swift" --exclude-dir=.git .; then
            echo "Potential hardcoded secrets found!"
            exit 1
          fi

      - name: Check dependencies
        run: |
          # Check for vulnerable dependencies
          if [ -f Package.resolved ]; then
            swift package audit
          fi

  build:
    needs: [test, security-scan]
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Import certificates
        if: github.event_name == 'push'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Import certificate
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode --output $CERTIFICATE_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Build app
        run: |
          xcodebuild archive \
            -project APGI-Explorer.xcodeproj \
            -scheme APGI-Explorer \
            -configuration Release \
            -derivedDataPath DerivedData \
            -archivePath DerivedData/APGI-Explorer.xcarchive \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="APGI_Explorer_Mac_App_Store"

      - name: Export app
        run: |
          xcodebuild -exportArchive \
            -archivePath DerivedData/APGI-Explorer.xcarchive \
            -exportPath DerivedData/Export \
            -exportOptionsPlist exportOptions.plist

      - name: Create DMG
        run: |
          # Create DMG
          hdiutil create -volname "APGI Explorer" \
                       -srcfolder DerivedData/Export/APGI-Explorer.app \
                       -ov -format UDZO \
                       APGI-Explorer-${{ github.event.inputs.version || '1.0.0' }}.dmg

      - name: Notarize app
        if: github.event_name == 'push'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          # Upload for notarization using notarytool
          xcrun notarytool submit \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$TEAM_ID" \
            --file APGI-Explorer-${{ github.event.inputs.version || '1.0.0' }}.dmg \
            --wait

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: APGI-Explorer-${{ github.event.inputs.version || '1.0.0' }}
          path: |
            APGI-Explorer-${{ github.event.inputs.version || '1.0.0' }}.dmg
            DerivedData/Logs/*.xcresult

  create-release:
    needs: build
    runs-on: macos-latest
    if: github.event_name == 'push'
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: APGI-Explorer-${{ github.event.inputs.version || '1.0.0' }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: APGI-Explorer-${{ github.event.inputs.version || '1.0.0' }}.dmg
          draft: false
          prerelease: ${{ github.event.inputs.release_type != 'release' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-app-store:
    needs: build
    runs-on: macos-latest
    if: github.event.inputs.release_type == 'release'
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: APGI-Explorer-${{ github.event.inputs.version || '1.0.0' }}

      - name: Deploy to App Store Connect
        run: |
          xcrun altool --upload-app \
            --type osx \
            --file DerivedData/Export/APGI-Explorer.app \
            --username "${{ secrets.APPLE_ID }}" \
            --password "${{ secrets.APPLE_ID_PASSWORD }}" \
            --asc-provider "${{ secrets.TEAM_ID }}"

  notify:
    needs: [create-release, deploy-app-store]
    runs-on: macos-latest
    if: always()
    steps:
      - name: Notify success
        if: needs.create-release.result == 'success'
        run: |
          echo "✅ Release created successfully!"
          echo "Version: ${{ github.event.inputs.version || '1.0.0' }}"
          echo "Release type: ${{ github.event.inputs.release_type }}"

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Release process failed!"
          echo "Check the logs for details."
