excluded:
  - Carthage
  - Pods
  - DerivedData
  - build
  - .build
  - "*.generated.swift"

# Opt-in rules
opt_in_rules:
  - empty_count
  - force_unwrapping
  - implicitly_unwrapped_optional
  - missing_docs
  - redundant_nil_coalescing
  - redundant_type_annotation
  - private_outlet
  - prohibited_super_call
  - nimble_operator
  - quick_discouraged_focused_test
  - quick_discouraged_pending_test

# Disabled rules
disabled_rules:
  - type_name

# Configured rules
line_length:
  warning: 150
  error: 200
  ignores_function_declarations: true
  ignores_comments: true
  ignores_interpolated_strings: true
  ignores_urls: true

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 40
    error: 50
  excluded:
    - id
    - URL
    - xl
    - xs
    - sm
    - md
    - lg
    - xxl
    - xxxl
    - a
    - r
    - g
    - b
    - i
    - x
    - y
    - z
    - _body

function_body_length:
  warning: 150
  error: 400

type_body_length:
  warning: 750
  error: 900

file_length:
  warning: 2200
  error: 2500

cyclomatic_complexity:
  warning: 15
  error: 25

# Custom rules
custom_rules:
  no_print:
    name: "No Print Statements"
    regex: '(?<!#if DEBUG\s)print\('
    message: "Prefer using logging framework instead of print()"
    severity: warning

# Reporter configuration
reporter: "xcode"
